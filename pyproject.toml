[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "espcua"
version = "1.0.0"
description = "Host Adapter and CUA-Driver Bridge for ESP32-P4 IP-KVM"
authors = [{name = "Zhihan Zheng"}]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/chnzzh/espcua-driver"
Repository = "https://github.com/chnzzh/espcua-driver.git"

[project.scripts]
espcua-driver = "espcua.cli:main"

[tool.setuptools.packages.find]
include = ["espcua*"]
